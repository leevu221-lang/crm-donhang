<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Nhập Thông Tin Khách Hàng - CRM Đơn Hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c2881e;
      --primary-dark: #9d6d13;
      --primary-light: #fff9ed;
      --primary-border: #f2dcab;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --focus-ring: rgba(194, 136, 30, 0.25);
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
      --radius: 16px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f8fafc 0%, #eef2f6 100%);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.08), 0 10px 15px -8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      overflow: hidden;
      position: relative;
    }

    /* Header */
    .form-header {
      background: linear-gradient(135deg, #fdf7ec 0%, #fae8c4 100%);
      padding: 24px 20px 18px;
      border-bottom: 2px solid var(--primary-border);
      text-align: center;
      user-select: none;
    }

    .form-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #783f04;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-clock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 4px 14px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      font-size: 0.8rem;
      color: #92400e;
      font-weight: 600;
      border: 1px solid rgba(194, 136, 30, 0.35);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Form Body */
    .form-body {
      padding: 22px;
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-label span.req {
      color: #ef4444;
      margin-left: 2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 1rem;
      pointer-events: none;
      z-index: 2;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px 11px 42px;
      font-size: 0.94rem;
      color: var(--text);
      background-color: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3.5px var(--focus-ring);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 70px;
      padding-top: 10px;
    }

    /* Staff Suggestion Dropdown */
    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid var(--primary-border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-height: 180px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      margin-top: 4px;
    }

    .suggestion-item {
      padding: 9px 14px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      transition: var(--transition);
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover, .suggestion-item.active {
      background-color: var(--primary-light);
      color: var(--primary-dark);
    }

    .suggestion-user-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .staff-match-note {
      font-size: 0.76rem;
      color: #059669;
      font-weight: 600;
      margin-top: 4px;
      display: none;
      align-items: center;
      gap: 4px;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-submit {
      flex: 2;
      background: linear-gradient(135deg, #d99b26 0%, #b87a14 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(184, 122, 20, 0.3);
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #c78b1d 0%, #a3690d 100%);
      box-shadow: 0 6px 18px rgba(184, 122, 20, 0.4);
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-reset {
      flex: 1;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid var(--border);
    }

    .btn-reset:hover {
      background-color: #e2e8f0;
      color: #1e293b;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hint {
      text-align: center;
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Dòng 'Xem kết quả' mở trực tiếp trang tính */
    .view-result-box {
      text-align: center;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed #e2e8f0;
    }

    .view-result-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: #15803d;
      border: 1.5px solid #86efac;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.08);
    }

    .view-result-btn:hover {
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
      color: #166534;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.16);
    }

    /* THÔNG BÁO GIỮA MÀN HÌNH ĐÚNG 5 GIÂY */
    .center-toast-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.25);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .center-toast-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .center-toast-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(16, 185, 129, 0.15);
      border: 2px solid #a7f3d0;
      text-align: center;
      max-width: 420px;
      width: 90%;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .center-toast-overlay.show .center-toast-card {
      transform: scale(1);
    }

    .toast-icon {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 12px;
      display: inline-block;
      animation: popIcon 0.5s ease;
    }

    @keyframes popIcon {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .toast-text {
      font-size: 1.12rem;
      font-weight: 700;
      color: #065f46;
      line-height: 1.5;
    }

    .toast-subtext {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 8px;
    }

    .footer-note {
      text-align: center;
      margin-top: 14px;
      font-size: 0.74rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <!-- Header -->
    <div class="form-header">
      <h2>
        <span>📋</span> Nhập Dữ Liệu Khách Hàng
      </h2>
      <div class="live-clock-badge">
        <span class="live-dot"></span>
        <span id="liveClock">Đang tải giờ...</span>
      </div>
    </div>

    <!-- Form Body -->
    <div class="form-body">
      <form id="customerForm" onsubmit="handleSubmit(event)">
        <!-- 1. Khách hàng -->
        <div class="form-group">
          <label class="form-label" for="khachHang">
            Khách Hàng <span class="req">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              id="khachHang" 
              class="form-control" 
              placeholder="VD: Nguyễn Văn A" 
              required 
              autocomplete="off"
            />
          </div>
        </div>

        <!-- 2. SĐT -->
        <div class="form-group">
          <label class="form-label" for="sdt">
            Số Điện Thoại <span class="req">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">📞</span>
            <input 
              type="tel" 
              id="sdt" 
              class="form-control" 
              placeholder="VD: 0987654321" 
              required 
              pattern="[0-9]{9,11}" 
              title="Vui lòng nhập 9 đến 11 chữ số" 
              autocomplete="off"
            />
          </div>
        </div>

        <!-- 3. Sản phẩm khách xem & lý do KH ra về -->
        <div class="form-group">
          <label class="form-label" for="sanPham">
            Sản Phẩm Khách Xem & lý do KH ra về
          </label>
          <div class="input-wrapper">
            <span class="input-icon" style="top: 12px;">🏷️</span>
            <textarea 
              id="sanPham" 
              class="form-control" 
              rows="2" 
              placeholder="VD: Áo sơ mi nam size L, khách phân vân về giá..."
            ></textarea>
          </div>
        </div>

        <!-- 4. Nhân viên phụ trách (Gợi ý tên từ tab 'ds nhân viên') -->
        <div class="form-group">
          <label class="form-label" for="nhanVien">
            Nhân Viên Phụ Trách
          </label>
          <div class="input-wrapper">
            <span class="input-icon">👔</span>
            <input 
              type="text" 
              id="nhanVien" 
              class="form-control" 
              placeholder="Nhập User/Mã NV hoặc Tên (VD: 38834)" 
              autocomplete="off"
              oninput="handleStaffInput(this.value)"
              onfocus="handleStaffFocus()"
              onblur="handleStaffBlur()"
            />
          </div>
          <div id="staffSuggestions" class="suggestions-box"></div>
          <div id="staffMatchNote" class="staff-match-note">
            <span>👤</span> <span id="staffMatchText"></span>
          </div>
        </div>

        <!-- Nút bấm -->
        <div class="button-group">
          <button type="button" class="btn btn-reset" onclick="resetForm()">
            🔄 Làm Mới
          </button>
          <button type="submit" id="btnSubmit" class="btn btn-submit">
            <span class="spinner" id="btnSpinner"></span>
            <span id="btnText">💾 Lưu Thông Tin</span>
          </button>
        </div>

        <div class="hint">
          Mẹo: Nhấn <b>Enter</b> hoặc <b>Ctrl + Enter</b> để lưu nhanh
        </div>

        <!-- DÒNG "XEM KẾT QUẢ" MỞ TRỰC TIẾP TRANG TÍNH GOOGLE SHEETS -->
        <div class="view-result-box">
          <a 
            href="https://docs.google.com/spreadsheets/d/1u11ohuoigi8lTEqtD8c_FI3oqHOlW4uGtBuwEbwu7zQ/edit?usp=sharing" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="view-result-btn" 
            title="Mở trang tính Google Sheets trong tab mới"
          >
            <span>📊</span> Xem Kết Quả (Trang Tính) <span style="font-size: 0.85rem;">↗</span>
          </a>
        </div>
      </form>
    </div>
  </div>

  <div class="footer-note">
    CRM Đơn Hàng • Tự động ghi nhận ngày giờ & STT
  </div>

  <!-- Thông báo nổi giữa màn hình 5 giây -->
  <div id="centerToast" class="center-toast-overlay" onclick="hideCenterToast()">
    <div class="center-toast-card">
      <div class="toast-icon">✅</div>
      <div class="toast-text" id="centerToastMessage">
        Đã lưu thành công!
      </div>
      <div class="toast-subtext">
        (Tự động đóng sau 5 giây hoặc bấm để đóng)
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ĐƯỜNG LINK CỐ ĐỊNH CHÍNH XÁC 100% CỦA BẠN (KHÔNG BAO GIỜ BỊ HỎI LINK NỮA)
    // =========================================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygdVOPLaAmO6Cu5NXaIqiTa09p45gboIyakug_wWHc8L2fJz-HL3MhJOMOq7I13rOOWQ/exec';
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1u11ohuoigi8lTEqtD8c_FI3oqHOlW4uGtBuwEbwu7zQ/edit?usp=sharing';

    const STAFF_STORAGE_KEY = 'crm_staff_list';
    let staffList = [];
    let toastTimer = null;

    // 1. Đồng hồ thời gian thực
    function updateClock() {
      const now = new Date();
      const options = { 
        timeZone: 'Asia/Ho_Chi_Minh', 
        day: '2-digit', month: '2-digit', year: 'numeric', 
        hour: '2-digit', minute: '2-digit', second: '2-digit', 
        hour12: false 
      };
      document.getElementById('liveClock').textContent = new Intl.DateTimeFormat('vi-VN', options).format(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Khởi tạo trang
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const cached = localStorage.getItem(STAFF_STORAGE_KEY);
        if (cached) staffList = JSON.parse(cached);
      } catch (e) {}

      fetchStaffList();
      document.getElementById('khachHang').focus();
    });

    // Tải danh sách nhân viên từ tab "ds nhân viên"
    function fetchStaffList() {
      const callbackName = 'staff_cb_' + Math.round(100000 * Math.random());
      window[callbackName] = function(res) {
        delete window[callbackName];
        if (res && res.success && res.staff) {
          staffList = res.staff;
          try { localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(staffList)); } catch(e) {}
        }
      };

      const script = document.createElement('script');
      script.src = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + 'action=getStaff&callback=' + callbackName;
      document.body.appendChild(script);
    }

    // Gợi ý Nhân Viên khi người dùng nhập
    function handleStaffInput(val) {
      const q = val.trim().toLowerCase();
      const box = document.getElementById('staffSuggestions');
      const noteBox = document.getElementById('staffMatchNote');
      const noteText = document.getElementById('staffMatchText');

      if (!q) {
        box.style.display = 'none';
        noteBox.style.display = 'none';
        return;
      }

      const matches = staffList.filter(s => {
        const u = (s.user || '').toLowerCase();
        const n = (s.name || '').toLowerCase();
        return u.includes(q) || n.includes(q);
      });

      const exactMatch = staffList.find(s => (s.user || '').toLowerCase() === q);
      if (exactMatch) {
        noteBox.style.display = 'flex';
        noteText.textContent = `Khớp nhân viên: ${exactMatch.name} (${exactMatch.user})`;
      } else {
        noteBox.style.display = 'none';
      }

      if (matches.length === 0) {
        box.style.display = 'none';
        return;
      }

      box.innerHTML = '';
      matches.slice(0, 6).forEach(item => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `
          <span><b>${escapeHtml(item.name)}</b></span>
        `;
        div.onmousedown = function(e) {
          e.preventDefault();
          selectStaff(item);
        };
        box.appendChild(div);
      });
      box.style.display = 'block';
    }

    function handleStaffFocus() {
      const val = document.getElementById('nhanVien').value;
      if (val) handleStaffInput(val);
    }

    function handleStaffBlur() {
      setTimeout(() => {
        document.getElementById('staffSuggestions').style.display = 'none';
        const val = document.getElementById('nhanVien').value.trim().toLowerCase();
        if (val) {
          const exact = staffList.find(s => (s.user || '').toLowerCase() === val);
          if (exact) {
            document.getElementById('nhanVien').value = exact.name;
            const noteBox = document.getElementById('staffMatchNote');
            noteBox.style.display = 'flex';
            document.getElementById('staffMatchText').textContent = `Khớp mã user: ${exact.user}`;
          }
        }
      }, 200);
    }

    function selectStaff(item) {
      document.getElementById('nhanVien').value = item.name;
      document.getElementById('staffSuggestions').style.display = 'none';
      const noteBox = document.getElementById('staffMatchNote');
      noteBox.style.display = 'flex';
      document.getElementById('staffMatchText').textContent = `Khớp nhân viên: ${item.name} (${item.user || ''})`;
    }

    // Phím tắt Enter
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        const form = document.getElementById('customerForm');
        if (form.checkValidity()) handleSubmit(e);
        else form.reportValidity();
      }
    });

    // Thông báo nổi giữa màn hình đúng 5 giây
    function showCenterToast(message) {
      const toast = document.getElementById('centerToast');
      const msg = document.getElementById('centerToastMessage');
      msg.innerHTML = message;
      toast.classList.add('show');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        hideCenterToast();
      }, 5000);
    }

    function hideCenterToast() {
      const toast = document.getElementById('centerToast');
      toast.classList.remove('show');
      if (toastTimer) {
        clearTimeout(toastTimer);
        toastTimer = null;
      }
    }

    function resetForm() {
      document.getElementById('customerForm').reset();
      document.getElementById('staffSuggestions').style.display = 'none';
      document.getElementById('staffMatchNote').style.display = 'none';
      document.getElementById('khachHang').focus();
    }

    // Xử lý Lưu Thông Tin siêu tốc trực tiếp tới SCRIPT_URL
    async function handleSubmit(e) {
      if (e) e.preventDefault();

      const khachHang = document.getElementById('khachHang').value.trim();
      const sdt = document.getElementById('sdt').value.trim();
      const sanPham = document.getElementById('sanPham').value.trim();
      let nhanVien = document.getElementById('nhanVien').value.trim();

      if (!khachHang || !sdt) {
        showCenterToast('⚠️ Vui lòng điền đủ <b>Tên Khách Hàng</b> và <b>Số Điện Thoại</b>!');
        return;
      }

      if (nhanVien) {
        const match = staffList.find(s => (s.user || '').toLowerCase() === nhanVien.toLowerCase());
        if (match && match.name) {
          nhanVien = match.name;
        }
      }

      const btn = document.getElementById('btnSubmit');
      const spinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Đang lưu...';

      const payload = { khachHang, sdt, sanPham, nhanVien };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          cache: 'no-cache',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams(payload).toString()
        });

        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = '💾 Lưu Thông Tin';

        showCenterToast(`Đã lưu thành công khách hàng:<br><b>${escapeHtml(khachHang)}</b>`);
        resetForm();

      } catch (err) {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = '💾 Lưu Thông Tin';
        showCenterToast('❌ Lỗi gửi dữ liệu tới Google Sheet!');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
